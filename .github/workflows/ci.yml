name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 \
              -validity 10000
          fi

      - name: Build & test
        run: ./gradlew build --stacktrace

      - name: Coverage gate (>=95% lines, gated scope)
        run: ./gradlew coverageVerify --stacktrace

      - name: Coverage report & summary
        if: always()
        run: |
          ./gradlew jacocoAggregateReport coverageGateReport
          mkdir -p site/full
          cp -r build/reports/jacoco/gated-html/* site/
          cp -r build/reports/jacoco/aggregated-html/* site/full/
          python3 scripts/coverage-summary.py \
            build/reports/jacoco/gated.xml build/reports/jacoco/aggregated.xml \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload coverage site (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: site/

  deploy-coverage-pages:
    name: Publish coverage to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage site
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
