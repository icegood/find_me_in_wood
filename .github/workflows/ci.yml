name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version is the commit count

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 \
              -validity 10000
          fi

      - name: Build & test
        run: ./gradlew build --stacktrace

      - name: Coverage gate (>=95% lines, gated scope)
        run: ./gradlew coverageVerify --stacktrace

      - name: Coverage report & summary
        if: always()
        run: |
          ./gradlew jacocoAggregateReport coverageGateReport
          mkdir -p site/full
          cp -r build/reports/jacoco/gated-html/* site/
          cp -r build/reports/jacoco/aggregated-html/* site/full/
          python3 scripts/coverage-summary.py \
            build/reports/jacoco/gated.xml build/reports/jacoco/aggregated.xml \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # The release job only signs and publishes these: no second build.
      - name: Build release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload unsigned release outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload coverage site (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: site/

  deploy-coverage-pages:
    name: Publish coverage to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage site
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Every push to main that builds and passes tests becomes a release with its APKs,
  # signed here from the build job's outputs.
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version is the commit count

      - name: Download unsigned outputs
        uses: actions/download-artifact@v4
        with:
          name: release-unsigned
          path: out

      # Same signing key as icegood/home_media_library (CN=find me in wood,
      # SHA-256 f5ca39b5...). PKCS12, so the key password defaults to the store one.
      - name: Sign APKs & bundle
        env:
          KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_KEYSTORE_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_JKS_BASE64:?ANDROID_KEYSTORE_JKS_BASE64 secret is not set}"
          : "${KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is not set}"
          : "${KEYSTORE_KEY_ALIAS:?ANDROID_KEYSTORE_KEY_ALIAS secret is not set}"
          export KEY_PASS="${KEYSTORE_KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          ks="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_JKS_BASE64" | base64 -d > "$ks"
          chmod 600 "$ks"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p dist
          sign() {
            "$apksigner" sign --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEYSTORE_KEY_ALIAS" --key-pass env:KEY_PASS --out "$2" "$1"
          }
          # The debug APK carries the runner's throwaway key: re-signed with the real one.
          sign out/apk/release/app-release*.apk dist/app-release.apk
          sign out/apk/debug/app-debug.apk dist/app-debug.apk
          cp out/bundle/release/app-release.aab dist/app-release.aab
          jarsigner -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASS \
            dist/app-release.aab "$KEYSTORE_KEY_ALIAS"
          rm -f "$ks"

      - name: Verify release signer
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for a in dist/*.apk; do
            "$apksigner" verify --print-certs "$a" \
              | grep -qi 'SHA-256 digest: f5ca39b5fa78523bde89375cd9c3676c9c2ac2b872198369779b473c49df34ad'
          done

      - name: Version
        id: version
        run: echo "name=0.3.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: find me in wood ${{ steps.version.outputs.name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/app-release.apk
            dist/app-debug.apk
            dist/app-release.aab
